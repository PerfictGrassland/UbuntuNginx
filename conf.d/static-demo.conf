server {
    listen 80;
    server_name _;
    root /home/schen88/static-html;
    index index.html index.htm;
    location / {
        try_files $uri $uri/ =404;
    }
    # base: '/vuedemo01/'
    # http://172.24.195.64:80/vuedemo01
    location /vuedemo01/ {
        try_files $uri $uri/ /vuedemo01/index.html;
    }

    # base: '/vuedemo03/'
    location /vuedemo03/ {
        # 指向你刚刚创建的 vuedemo03 目录
        # alias /home/schen88/static-html/;
        index index.html index.htm;
        try_files $uri $uri/ /vuedemo03/index.html;
    }

    # 👇 2. 新增这里：拦截 /uads/ 开头的请求，转发给 Egg 后端 (7001)
    # http://172.24.195.64:80/uads/api/armscage/firingTest/schedule/absentList
    # http://172.24.195.64:7001/uads/api/armscage/firingTest/schedule/absentList
    location /uads/ {
        proxy_pass http://127.0.0.1:7001; 
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}

