server {
    # base: '/vuedemo02/',
    # 监听 8082 端口
    # http://172.24.195.64:8082
    listen 8082;
    server_name _;
    # root /home/schen88/static-html;
    # index index.html index.htm;
    
    # 注意这里加上了 /vuedemo02/ 的后缀
    location /vuedemo02/ {
        # 指向你刚刚创建的 vuedemo03 目录
        # alias /home/schen88/static-html/;
        alias /home/schen88/static-html/vuedemo02/; 
        index index.html index.htm;
        try_files $uri $uri/ /vuedemo03/index.html;
    }

    # 当用户直接访问 http://172.24.195.64:8082/ 时，自动跳转到带前缀的路径
    location = / {
        return 301 /vuedemo02/;
    }
}

